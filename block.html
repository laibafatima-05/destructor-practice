<!DOCTYPE html>
<html>
<head>
    <title>HTML Quotations</title>
</head>
<body>
    <h1>HTML Blockquote</h1>
    <p>This is a quotation:</p>
    <blockquote>
        HTML is the standard language used to create webpages.
        It is used to structure the content of a webpage.HTML 
        allows us to add headings, paragraphs,images,links and
        many other elements to a webpage.
    </blockquote>
</body>
</html>
