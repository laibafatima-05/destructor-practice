<!DOCTYPE html>
<html>
    <head>
        <title>HTML Buttons</title>
        <style>
        .testbtn{
            background-color: violet;
            color: white;
            font-size: 20px;
            padding: 20px;
            border: none;
            border-radius: 15px;
            cursor: pointer}
        .testbtn:hover{
            background-color:purple;
        }
        </style>
    </head>
    <body>
        <h1>HTML Buttons</h1>
        <h3>Styled Button</h3>
        <button class="testbtn">Styled Button</button>
        <h3>Disabled Button</h3>
        <button disabled>Disabled Button</button>
        <h3>Normal Button</h3>
        <button type="button">Normal Button</button>
        <h3>Submit Button</h3>
        <button type="submit">Submit Button</button>
        <h3>Reset Button</h3>
        <button type="reset">Reset Button</button>
    </body>
</html>
