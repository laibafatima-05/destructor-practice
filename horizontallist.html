<!DOCTYPE html>
<html>
<head>
    <style>
ul {list-style-type: none;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #055f75;}

li {float: left;}
li a { display: inline;
       color: beige;
       text-align: center;
       padding: 16px;
       text-decoration: none;}
li a:hover { background-color: brown;}
     </style>
</head>
<body>
    <h3>Horizontal list with CSS</h3>
<ul>
  <li><a href="#maths">Maths</a></li>
  <li><a href="#urdu">Urdu</a></li>
  <li><a href="#english">English</a></li>
</ul>
</body>
</html>
