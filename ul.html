<!DOCTYPE html>
<html>
<head>
    <title>Unordered List</title>
</head>
<body>
    <h2>Unordered List</h2>
  <h3>Disc List</h3>
<ul style="list-style-type: disc;">
    <li>Salt</li>
    <li>Sugar</li></ul>
  <h3>Square List</h3>
<ul style="list-style-type: square;">
    <li>Apple</li>
    <li>Mango</li></ul>
  <h3>Circle List</h3>
<ul style="list-style-type: circle;">
    <li>Pepper</li>
    <li>Salt</li></ul>
  <h3>No List Marker</h3>
<ul style="list-style-type: none;">
    <li>Home</li>
    <li>Contact</li></ul>
  <h3>Nested List</h3>
<ul>
    <li>Fruits
  <ul> 
    <li>Mango</li>
    <li>Apple</li>
  </ul>
  </li>
    <li>Sports
  <ul>
    <li>Cricket</li>
    <li>Hockey</li>
</ul>
</body>
</html>
