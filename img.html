<!DOCTYPE html>
<html>
<head>
    <title>HTML Links</title>
<style>
    img {
        width:200%;
    }
</style>
</head>
<body>
    <h1>Image as a link</h1>
    <a href="https://cdn.stocksnap.io/img-thumbs/280h/rain-flower_ERM78DQMOZ.jpg">
        <img src="flowerimg.jpg alt="A beautiful flower" style="width:30px; height:40px;">
    </a>
    <h2>Alternative text</h2>
    <img src="wrongimg.jpg" alt="Abeautiful flower" width="400" height="500">
    <h3>Image size</h3>
    <img src="flowerimg.jpg" alt="A beautiful flower" style="width:400px; height:500px;">
    <h4>Images in Another Folder</h4>
    <img src="/IMAGES/flowerimg.jpg" alt="A beautiful flower" style="width:400px; height:500px;">
    <h5>Images on Another Website</h5>
    <img src="https://cdn.stocksnap.io/img-thumbs/280h/rain-flower_ERM78DQMOZ.jpg"
    alt="A beautiful flower" style="width:400px; height:500px;">
    <h6>Animated Images</h6>
    <img src="giphy.gif" alt="Switch on" style="width:40px; height:50px;">
    
<p><strong>Float the image to the right:</strong></p>
<p>
<img  src="flowerimg.jpg" alt="A beautiful flower" style="float:left;width:42px;height:42px;">
A paragraph with a floating image. A paragraph with a floating image. A paragraph with a floating image.
</p>
</body>
</html>
