<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Padding</title>
<style>
table, th, td {
    border: 1px solid black;
    border-collapse: collapse;}
th, td {
    padding-top: 10px;
    padding-bottom: 20px;
    padding-left: 30px;
    padding-right: 40px;}
</style>
</head>
<body>
    <h3>Cell Padding</h3>
<table style="width:30%;">
    <tr>
        <th>Fruits</th>
        <th>Vegetables</th>
    </tr>
    <tr>
        <td>Apple</td>
        <td>Mango</td>
    </tr>
    <tr>
        <td>Onion</td>
        <td>Potato</td>
    </tr>
</table>
</body>
</html>
