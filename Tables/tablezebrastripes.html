<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Zebra Stripes</title>
<style>
table{
    border-collapse: collapse;
    width:40%;}
th, td {
    text-align:left;
    padding:10px;}
tr:nth-child(even){
    background-color: rgb(190, 135, 181);}
</style>
</head>
<body>
    <h2>Zebra Striped Table</h2>
<table>
    <tr>
        <th>Fruits</th>
        <th>Vegetables</th>
    </tr>
    <tr>
        <td>Apple</td>
        <td>Onion</td>
    </tr>
    <tr>
        <td>Mango</td>
        <td>Cabbage</td>
    </tr>
</table>
</body>
</html>
