<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Sizes</title>
<style>
 table, th, td, .table1, .table2, .table3 {
    border: 1px solid black;
    border-collapse: collapse;}
</style>
</head>
<body>
    <h2>HTML Table Width</h2>
<table style="width:50%;" class="table1">
    <tr>
        <th>Fruits</th>
        <th>Vegetables</th>
    </tr>
    <tr>
        <td>Apple</td>
        <td>Onion</td>
    </tr>
    <tr>
        <td>Mango</td>
        <td>Potato</td>
    </tr>
</table>
     <h2>HTML Table Column Width</h2>
<table style="width:50%;" class="table2">
    <tr>
        <th style="width:60%;">Fruits</th>
        <th>Vegetables</th>
    </tr>
    <tr>
        <td>Apple</td>
        <td>Onion</td>
    </tr>
    <tr>
        <td>Mango</td>
        <td>Potato</td>
    </tr>
</table>
    <h2>HTML Table Row Height</h2>
<table style="width:30%;" class="table3">
    <tr>
        <th>Fruits</th>
        <th>Vegetables</th>
    </tr>
    <tr style="height:100px;">
        <td>Apple</td>
        <td>Onion</td>
    </tr>
    <tr>
        <td>Mango</td>
        <td>Potato</td>
    </tr>
</table>
</body>
</html>
