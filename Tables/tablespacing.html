<!DOCTYPE html>
<html>
<head>
      <title>Table Spacing</title>
<style>
table, th, td {border:1px solid black;}
table{border-spacing:20px;}
</style>
</head>
<body>
    <h3>Cell Spacing</h3>
<table style="width:50%;">
    <tr>
        <th>Fruits</th>
        <th>Vegetables</th>
    </tr>
    <tr>
        <td>Apple</td>
        <td>Onion</td>
    </tr>
    <tr>
        <td>Mango</td>
        <td>Potato</td>
    </tr>
</table>
</body>
</html>
