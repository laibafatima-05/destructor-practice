<!DOCTYPE html>
<html>
<head>
    <title>HTML Tables</title>
</head>
<style>
  table, th, td {border: 2px solid black;}
</style>
<body>
    <h2>HTML Table</h2>
<table style="width:70%;">
    <tr>
        <th>Fruits</th>
        <th>Vegetables</th>
    </tr>
    <tr>
        <td>Apple</td>
        <td>Tomato</td>
    </tr>
    <tr>
        <td>Mango</td>
        <td>Onion</td>
    </tr>
</table>
</body>
</html>
