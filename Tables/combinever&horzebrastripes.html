<!DOCTYPE html>
<html>
<head>
    <title>HTML Styling</title>
<style>
table, th, td{
    border:1px solid black;
    border-collapse: collapse;} 
tr:nth-child(even){
    background-color: rgba(182, 182, 233, 0.5)}
td:nth-child(even){
    background-color:rgb(181, 181, 233, 0.5);}
</style>
</head>
<body>
<h2>Combine Vertical & Horizontal Zebra Stripes</h2>
<table style="width:40%;">
    <tr>
        <th>Fruits</th>
        <th>Vegetables</th>
    </tr>
    <tr>
        <td>Apple</td>
        <td>Mango</td>
    </tr>
    <tr>
        <td>Onion</td>
        <td>Cabbage</td>
    </tr>
</table>
</body>
</html>
