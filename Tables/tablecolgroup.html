<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Colgroup</title>
<style>
table, th, td{
    border:1px solid black;
    border-collapse: collapse;}
</style>
</head>
<body>
    <h2>Colgroup</h2>
<table style="width:40%;">
<colgroup>
    <col span="1" style="background-color: rgb(185, 217, 238);">
</colgroup>
   <tr>
    <th>Fruits</th>
    <th>Vegetables</th>
  </tr>
  <tr>
    <td>Apple</td>
    <td>Onion</td>
  </tr>
  <tr>
    <td>Mango</td>
    <td>Cabbage</td>
  </tr>
</table>
</body>
</html>
