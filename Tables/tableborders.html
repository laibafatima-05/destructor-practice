<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Borders</title>
<style>
table, th, td, .table1, .table2, .table3, .table4{
     border: 1px solid black;
     border-collapse:collapse;
    border-radius:10px;
    border-style: dotted;}
th, td {
  background-color: #96D4D4;}
</style>
</head>
<body>
    <h2>Collapsed Table Border</h2>
    <table style="width:50%" class="table1">
    <tr>
        <th>Fruits</th>
        <th>Vegetables</th>
    </tr>
    <tr>
        <td>Apple</td>
        <td>Onion</td>
    </tr>
    <tr>
        <td>Mango</td>
        <td>Potato</td>
    </tr>
    </table>
    <h2>Style Table Border</h2>
    <table style="width:50%;" class="table2">
     <tr>
        <th>Fruits</th>
        <th>Vegetables</th>
    </tr>
    <tr>
        <td>Apple</td>
        <td>Onion</td>
    </tr>
    <tr>
        <td>Mango</td>
        <td>Potato</td>
    </tr>
    </table>
    <h2>Round Table Border</h2>
    <table style="width:50%;" class="table3">
    <tr>
        <th>Fruits</th>
        <th>Vegetables</th>
    </tr>
    <tr>
        <td>Apple</td>
        <td>Onion</td>
    </tr>
    <tr>
        <td>Mango</td>
        <td>Potato</td>
    </tr>       
    </table>
    <h2>Dotted Table Border</h2>
    <table style="width:50%;" class="table4">
    <tr>
        <th>Fruits</th>
        <th>Vegetables</th>
    </tr>
    <tr>
        <td>Apple</td>
        <td>Onion</td>
    </tr>
    <tr>
        <td>Mango</td>
        <td>Potato</td>
    </tr>
    </table>
</body>
</html>
