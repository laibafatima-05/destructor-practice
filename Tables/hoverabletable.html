<!DOCTYPE html>
<html>
    <head>
        <title>HTML Table Styling</title>
<style>
table {
    border-collapse:collapse;
    width:40%;}
th, td{
    padding:10px;
    text-align:left;
    border-bottom:1px solid rgb(153, 152, 152);}
tr:hover{background-color:rgb(252, 209, 216);}
</style>
</head>
<body>
    <h2>Hoverable Table</h2>
<table>
   <tr>
    <th>Fruits</th>
    <th>Vegetables</th>
  </tr>
  <tr>
    <td>Apple</td>
    <td>Onion</td>
  </tr>
  <tr>
    <td>Mango</td>
    <td>Cabbage</td>
  </tr>
</table>
</body>
</html>
