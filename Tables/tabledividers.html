<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Styling</title>
<style>
table {
    border-collapse: collapse;
    width:40%;}
tr{border-bottom:1px solid rgb(184, 182, 182);
   text-align: center;}
</style>
</head>
<body>
    <h2>Horizontal Dividers</h2>
<table>
  <tr>
    <th>Fruits</th>
    <th>Vegetables</th>
  </tr>
  <tr>
    <td>Apple</td>
    <td>Onion</td>
  </tr>
  <tr>
    <td>Mango</td>
    <td>Cabbage</td>
  </tr>
</table>
</body>
</html>
