<!DOCTYPE html>
<html>
<head>
    <title>HTML Colgroup</title>
<style>
table, th, td {
  border: 1px solid black;
  border-collapse: collapse;}
</style>
</head> 
<body>
    <h2>Hide Columns</h2>
    <table style="width:40%;">
<colgroup>
    <col span="1">
    <col span="1" style="visibility: collapse">
  </colgroup>
 <tr>
        <th>Class</th>
        <th>Subject</th>
        <th>Teacher</th>
    </tr>
    <tr>
        <td>1</td>
        <td>Urdu</td>
        <td>Ms.Ayesha</td>
    </tr>
    <tr>
        <td>2</td>
        <td>English</td>
        <td>Ms.Zainab</td>
    </tr> 
</body>
</html>
