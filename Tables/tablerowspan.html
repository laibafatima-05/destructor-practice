<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Rowspan</title>
<style>
table,th,td{
    border: 1px solid black;
    border-collapse: collapse;}
</style>
</head>
<body>
    <h2>Table Rowspan</h2>
<table style="width:40%;">
    <tr>
        <th>Fruit</th>
        <td>Mango</td>
    </tr>
    <tr>
        <th rowspan="2">Vegetables</th>
        <td>Onion</td>
    </tr>
    <tr>
        <td>Cabbage</td>
    </tr>
</table>
</body>
</html>
