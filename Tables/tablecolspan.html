<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Colspan</title>
<style>
table, th, td{
    border: 1px solid black;
    border-collapse: collapse;}
</style>
</head>
<body>
    <h2>Table Colspan</h2>
<table style="width:40%;">
    <tr>
        <th colspan="2">Fruits</th>
        <th>Vegetables</th>
    </tr>
    <tr>
        <td>Mango</td>
        <td>Apple</td>
        <td>Onion</td>
    </tr>
    <tr>
        <td>Banana</td>
        <td>Grapes</td>
        <td>Cabbage</td>
    </tr>
</table>
</body>
</html>
