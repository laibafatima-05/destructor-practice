<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Favorite Hobby</title>
    <!-- Favicon -->
    <link rel="icon" href="images/icon.png">
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Heading -->
    <header>
        <h1>My Favorite Hobby</h1>
        <p>Reading Books</p>
    </header>
    <!-- Introduction -->
    <section id="intro">
        <h2>Introduction</h2>
        <p>
            Reading is my favorite hobby. It helps me gain knowledge,
            improve my vocabulary, and relax my mind.
        </p>
        <!-- Image -->
        <img src="images/reading.jpg" alt="Reading Image">
    </section>
    <!-- Table -->
    <section>
        <h2>My Reading Time</h2>
        <table>
            <tr>
                <th>Day</th>
                <th>Time</th>
            </tr>
            <tr>
                <td>Monday</td>
                <td>30 min</td>
            </tr>
            <tr>
                <td>Friday</td>
                <td>45 min</td>
            </tr>
        </table>
    </section>
    <!-- Links -->
    <section>
        <h2>Links</h2>
        <!-- Internal Link -->
        <a href="#intro">Go to Introduction</a>
        <br><br>
        <!-- External Link -->
        <a href="https://www.wikipedia.org/" target="_blank">
            Visit Wikipedia
        </a>
    </section>
</body>
</html>
