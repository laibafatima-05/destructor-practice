<!DOCTYPE html>
<html>
<head>
    <title>HTML List</title>
</head>
<body>
    <h2>An Unordered HTML List</h2>
<ul>
    <li>Sugar</li>
    <li>Salt</li>
    <li>Pepper</li>
</ul>
     <h2>An Ordered List</h2>
<ol>
    <li>Sugar</li>
    <li>Salt</li>
    <li>Pepper</li>
</ol>
     <h3>Description List</h3>
<dl>
    <dt>Sugar</dt>
    <dd>It is used to make food sweet.</dd>
    <dt>Salt</dt>
    <dd>It is used to add flavor to food.</dd>
    <dt>Pepper</dt>
    <dd>It is used to make food spicy.</dd>
</dl>
</body>
</html>
