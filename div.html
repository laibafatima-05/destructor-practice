<!DOCTYPE html>
<html>
    <head>
        <title>HTML Div</title>
        <style>
            .center {
                width: 50%;
                margin: auto;
            }
            .flex {
                display: flex;
            }
            .inline {
                display: inline-block;
                width: 30%;
            }
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
        </style>
    </head>
    <body>
        <h1>HTML Div Element</h1>

        <div class="center">
            <h2>My Hobby</h2>
            <p>I like reading books.</p>
        </div>
        <h2>Flex</h2>
        <div class = "flex">
            <div>Box 1</div>
            <div>Box 2</div>
            <div>Box 3</div>
        </div>
        <h2>Inline Block</h2>
        <div class="inline">Box 1</div>
        <div class="inline">Box 2</div>
        <div class="inline">Box 3</div>
        <h2>Grid</h2>
        <div class = "grid">
            <div>Box 1</div>
            <div>Box 2</div>
            <div>Box 3</div>
            <div>Box 4</div>
        </div>
    </body>
</html>
